---
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/recipes/debian.yml

variables:
  SALSA_CI_ENABLE_BUILD_PACKAGE_PROFILES: 1
  SALSA_CI_ENABLE_VALIDATE_PACKAGE_CLEAN_UP: 1

debrebuild:
  allow_failure: true

test-build-profiles:
  extends: .test-build-package-profiles
  parallel:
    matrix:
      - BUILD_PROFILES:
        - nocheck
        - nodoc
